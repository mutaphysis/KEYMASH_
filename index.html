<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000800">
<meta name="description" content="A live-coding toy where any text is a valid program — let the dog, the kid or you mash the keys.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KEYMASH_">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>KEYMASH_ — every keystroke compiles</title>
</head>
<body>
<div id="app" class="crt">
  <!-- ================= EDIT MODE ================= -->
  <section id="edit">
    <header>
      <div class="logo" data-text="KEYMASH_">KEYMASH_</div>
      <span id="version" class="ver"></span>
      <div id="status"><b class="ok">0 ERRORS</b> · <span id="st-threads">0</span> THREADS · <span id="st-glyphs">0</span> GLYPHS<b id="st-live"> · LIVE</b></div>
      <button id="btn-mute-edit" class="hbtn" title="sound on/off">🔊</button>
    </header>
    <div id="editorWrap">
      <canvas id="rain"></canvas>
      <canvas id="sparks"></canvas>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="type anything.&#10;mash the keys.&#10;let the dog walk over it.&#10;&#10;there are no errors."></textarea>
    </div>
    <div id="keybar" role="toolbar" aria-label="extra keys"></div>
    <nav id="controls">
      <button id="btn-run" class="primary"><i>▶</i><span>RUN</span></button>
      <button id="btn-mash" title="let a virtual paw type"><i>🐾</i><span>MASH</span></button>
      <button id="btn-clear"><i>✖</i><span>CLEAR</span></button>
      <button id="btn-save"><i>💾</i><span>SAVE</span></button>
      <button id="btn-load"><i>📂</i><span>LOAD</span></button>
    </nav>
  </section>

  <!-- ================= PLAY MODE ================= -->
  <section id="play" hidden>
    <div id="stageWrap">
      <canvas id="stage"></canvas>
      <div id="hud"></div>
      <div id="log"></div>
      <div id="boot"></div>
      <div id="idle"><button id="btn-idle-run">▶ RUN</button><p>edit on the left — changes go live while it runs</p></div>
      <div class="playbtns">
        <button id="btn-mute" title="sound on/off">🔊</button>
        <button id="btn-restart" title="restart">⟲</button>
        <button id="btn-stop" class="primary">■ EDIT</button>
      </div>
    </div>
    <div id="codeview"></div>
  </section>

  <!-- ================= DRAWER ================= -->
  <div id="drawer" hidden>
    <div class="panel">
      <div class="phead"><span>// PROGRAMS</span><button id="drawer-close">✖</button></div>
      <div id="drawer-body"></div>
    </div>
  </div>
  <div id="toast" hidden></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
