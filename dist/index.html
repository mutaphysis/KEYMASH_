<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000800">
<title>KEYMASH_ — every keystroke compiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>:root {
  --g: #39ff7a; --g2: #00d45a; --gd: #0a3d1c; --bg: #000800; --pink: #ff2e88; --cyan: #29f3ff;
  --mono: "Share Tech Mono", ui-monospace, Menlo, Consolas, monospace;
  --vh: 100dvh; --vt: 0px;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
body { color: var(--g); font-family: var(--mono); position: fixed; inset: 0; }
button { font-family: var(--mono); }

#app { position: fixed; left: 0; right: 0; top: 0; height: var(--vh); transform: translateY(var(--vt)); display: flex; flex-direction: column; overflow: hidden; }
section { display: flex; flex-direction: column; flex: 1; min-height: 0; }
section[hidden] { display: none; }

/* CRT feel: scanlines + vignette over everything */
.crt::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 50;
  background:
    repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.22) 3px),
    radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.65) 100%);
  mix-blend-mode: multiply;
}
.crt::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 51;
  background: rgba(57,255,122,.025); animation: flicker 4s infinite steps(1);
}
@keyframes flicker { 0%,100% { opacity: .6 } 37% { opacity: 1 } 38% { opacity: .3 } 39% { opacity: 1 } 80% { opacity: .8 } }

/* ---------- header ---------- */
header { padding: calc(10px + var(--sat)) 14px 6px; display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; }
header #status { order: 3; flex-basis: 100%; }
#app.split header #status { order: 0; flex-basis: auto; }
.logo {
  font-family: "Major Mono Display", var(--mono); font-size: 26px; letter-spacing: 2px; position: relative; color: var(--g);
  text-shadow: 0 0 8px var(--g), 0 0 22px rgba(57,255,122,.5);
}
.logo::before, .logo::after { content: attr(data-text); position: absolute; left: 0; top: 0; width: 100%; overflow: hidden; }
.logo::before { color: var(--pink); left: 2px; text-shadow: none; animation: glitchA 2.6s infinite linear alternate-reverse; opacity: .8; }
.logo::after { color: var(--cyan); left: -2px; text-shadow: none; animation: glitchB 3.1s infinite linear alternate-reverse; opacity: .8; }
@keyframes glitchA { 0% { clip-path: inset(0 0 85% 0) } 20% { clip-path: inset(40% 0 40% 0) } 40% { clip-path: inset(80% 0 2% 0) } 60% { clip-path: inset(10% 0 70% 0) } 80% { clip-path: inset(60% 0 20% 0) } 100% { clip-path: inset(30% 0 60% 0) } }
@keyframes glitchB { 0% { clip-path: inset(70% 0 10% 0) } 25% { clip-path: inset(5% 0 80% 0) } 50% { clip-path: inset(50% 0 30% 0) } 75% { clip-path: inset(20% 0 65% 0) } 100% { clip-path: inset(90% 0 0 0) } }
#status { font-size: 12px; color: #6fbf87; letter-spacing: 1px; }
#status .ok { color: var(--g); animation: blink 1.2s infinite steps(2); }
#st-live { display: none; color: var(--pink); }
#app.split.playing #st-live { display: inline; }
.hbtn { margin-left: auto; width: 52px; height: 52px; border-radius: 12px; font-size: 22px; background: rgba(0,0,0,.6); border: 1px solid rgba(57,255,122,.45); color: var(--g); }
#app.kb #status { display: none; }
#app.kb header { padding-top: calc(4px + var(--sat)); padding-bottom: 2px; }
#app.kb .logo { font-size: 20px; }
#app.kb .hbtn { width: 44px; height: 40px; }
#app.kb #controls > button { height: 56px; }
@keyframes blink { 50% { opacity: .35 } }

/* ---------- editor ---------- */
#editorWrap { position: relative; flex: 1; min-height: 80px; margin: 4px 10px; border: 1px solid rgba(57,255,122,.35); border-radius: 6px; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(57,255,122,.08) inset, 0 0 30px rgba(57,255,122,.12) inset, 0 0 18px rgba(57,255,122,.15); background: rgba(0,12,4,.9); }
#rain, #sparks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#rain { opacity: .55; }
#code {
  position: absolute; inset: 0; width: 100%; height: 100%; resize: none; border: 0; outline: 0; background: transparent;
  color: #b6ffcc; caret-color: var(--g); padding: 14px 14px 40px; margin: 0;
  font: 20px/1.45 var(--mono); letter-spacing: .5px; white-space: pre-wrap; word-break: break-all; overflow-wrap: anywhere;
  text-shadow: 0 0 6px rgba(57,255,122,.9), 0 0 16px rgba(57,255,122,.45);
  -webkit-appearance: none; appearance: none; border-radius: 0; z-index: 2;
}
#code::placeholder { color: rgba(57,255,122,.35); text-shadow: none; }
#code::selection { background: rgba(255,46,136,.5); color: #fff; }
#editorWrap.pulse { animation: wrapPulse .25s ease-out; }
@keyframes wrapPulse { 0% { box-shadow: 0 0 40px rgba(57,255,122,.5) inset, 0 0 30px rgba(57,255,122,.5); } }

/* ---------- key bar ---------- */
#keybar { display: flex; gap: 8px; padding: 8px 10px; overflow-x: auto; scrollbar-width: none; flex: 0 0 auto; }
#keybar::-webkit-scrollbar { display: none; }
#keybar button {
  flex: 0 0 auto; min-width: 56px; height: 56px; padding: 0 12px; border-radius: 10px; font-size: 26px;
  background: rgba(57,255,122,.08); border: 1px solid rgba(57,255,122,.35); color: var(--g); touch-action: manipulation;
}
#keybar button.nav { background: rgba(41,243,255,.1); border-color: rgba(41,243,255,.4); color: var(--cyan); }
#keybar button:active { background: var(--g); color: #000; box-shadow: 0 0 14px var(--g); }

/* ---------- controls ---------- */
#controls { display: flex; gap: 8px; padding: 4px 10px calc(10px + var(--sab)); flex: 0 0 auto; }
#app #controls > button { height: 70px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
#controls button i { font-style: normal; font-size: 26px; line-height: 1; text-shadow: none; }
#controls button span { font-size: 11px; letter-spacing: 1px; }
#controls button.primary i { font-size: 30px; }
#controls button.primary span { font-size: 15px; font-weight: bold; }
#controls button, .playbtns button, #drawer button {
  flex: 1; height: 46px; border-radius: 6px; background: rgba(0,0,0,.6); color: var(--g); border: 1px solid rgba(57,255,122,.45);
  font-size: 12px; letter-spacing: .5px; text-shadow: 0 0 6px rgba(57,255,122,.7); white-space: nowrap; touch-action: manipulation;
  min-width: 0; padding: 0 4px; overflow: hidden; text-overflow: clip;
}
#controls button.primary, .playbtns button.primary { background: var(--g); color: #000; text-shadow: none; font-weight: bold; box-shadow: 0 0 18px rgba(57,255,122,.6); flex: 1.4; font-size: 15px; }
#controls button:active, .playbtns button:active { transform: scale(.95); }

/* ---------- play mode ---------- */
#stageWrap { position: relative; flex: 0 0 62%; min-height: 0; background: #000; border-bottom: 1px solid rgba(57,255,122,.4); }
#stage { position: absolute; inset: 0; display: block; touch-action: none; }
#hud { position: absolute; left: 10px; top: calc(8px + var(--sat)); font-size: 11px; color: rgba(57,255,122,.85); text-shadow: 0 0 6px #000; pointer-events: none; letter-spacing: 1px; line-height: 1.5; }
#hud .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 3px; vertical-align: -1px; transition: transform .08s, opacity .3s; }
#log { position: absolute; left: 10px; bottom: 80px; right: 10px; font-size: 11px; line-height: 1.45; color: rgba(130,255,170,.9); pointer-events: none; text-shadow: 0 0 4px #000, 0 0 2px #000; white-space: nowrap; overflow: hidden; }
#log div { overflow: hidden; text-overflow: ellipsis; }
#log div:last-child::after { content: "█"; animation: blink .8s infinite steps(2); }
#boot { position: absolute; inset: 0; background: #000; color: var(--g); font-size: 15px; padding: calc(24px + var(--sat)) 18px; white-space: pre; display: none; z-index: 5; text-shadow: 0 0 8px var(--g); }
#boot.on { display: block; }
#idle { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(circle, rgba(0,40,15,.9), #000 70%); z-index: 4; }
#idle button { font-family: var(--mono); font-size: 28px; padding: 18px 40px; border-radius: 14px; background: var(--g); color: #000; border: 0; font-weight: bold; box-shadow: 0 0 30px rgba(57,255,122,.6); animation: blink 1.6s infinite; }
#idle p { color: rgba(57,255,122,.6); font-size: 13px; margin: 0; letter-spacing: 1px; }
#app.split:not(.playing) #idle { display: flex; }
.playbtns { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
.playbtns button { flex: 0 0 auto; height: 60px; min-width: 64px; padding: 0 16px; font-size: 22px; border-radius: 12px; }
.playbtns button.primary { font-size: 18px; }
#codeview {
  position: relative; flex: 1; overflow-y: auto; padding: 14px 14px calc(30vh + var(--sab)); font: 18px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all;
  color: rgba(57,255,122,.42); background: linear-gradient(#000a03, #000); scrollbar-width: none;
}
#codeview::-webkit-scrollbar { display: none; }
#codeview span { transition: background-color .7s ease-out, color .7s ease-out, text-shadow .7s; border-radius: 2px; }
#codeview span.on { background: var(--c); color: #000; transition: none; box-shadow: 0 0 12px var(--c); text-shadow: none; }
#codeview span.seen { color: #b6ffcc; text-shadow: 0 0 6px rgba(57,255,122,.7); }

/* ---------- drawer & toast ---------- */
#drawer { position: absolute; inset: 0; background: rgba(0,0,0,.75); z-index: 60; display: flex; align-items: flex-end; }
#drawer[hidden] { display: none; }
#drawer .panel { width: 100%; max-height: 80%; overflow-y: auto; background: #010d05; border-top: 1px solid var(--g); box-shadow: 0 -10px 40px rgba(57,255,122,.25); padding: 10px 12px calc(16px + var(--sab)); }
.phead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; color: var(--g); }
.phead button { flex: 0 0 auto !important; width: 46px; }
#drawer h4 { margin: 14px 0 6px; font-weight: normal; color: #6fbf87; font-size: 12px; letter-spacing: 2px; }
.item { display: flex; gap: 6px; align-items: stretch; margin-bottom: 6px; }
.item .name { flex: 1; text-align: left; padding: 8px 10px; height: auto !important; white-space: normal !important; }
.item .name small { display: block; color: rgba(57,255,122,.5); font-size: 11px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: none; }
.item .del { flex: 0 0 46px !important; color: var(--pink) !important; border-color: rgba(255,46,136,.5) !important; }
#toast { position: absolute; left: 50%; top: calc(64px + var(--sat)); transform: translateX(-50%); z-index: 70; background: #000; border: 1px solid var(--g); padding: 10px 14px; border-radius: 6px; box-shadow: 0 0 20px rgba(57,255,122,.4); display: flex; gap: 12px; align-items: center; font-size: 14px; white-space: nowrap; }
#toast[hidden] { display: none; }
#toast button { background: var(--g); color: #000; border: 0; border-radius: 4px; padding: 6px 10px; font-family: var(--mono); }

/* transition glitch */
#app.switching { animation: switchGlitch .35s steps(4); }
@keyframes switchGlitch { 0% { filter: hue-rotate(0) contrast(1); transform: translateY(var(--vt)) } 25% { filter: hue-rotate(90deg) contrast(2); transform: translate(6px, var(--vt)) skewX(4deg) } 50% { filter: invert(1); transform: translate(-6px, var(--vt)) } 75% { filter: hue-rotate(200deg) saturate(3); transform: translateY(var(--vt)) scaleY(.98) } 100% { filter: none; } }

/* ---------- side by side (iPad landscape, desktop) ---------- */
#app.split { flex-direction: row; }
#app.split section { display: flex; }
#app.split #edit { flex: 0 0 42%; max-width: 640px; border-right: 1px solid rgba(57,255,122,.35); }
#app.split #play { flex: 1; }
#app.split #stageWrap { flex: 0 0 68%; }
#app.split #btn-stop { display: none; }
#app.split #codeview { padding-bottom: 40%; font-size: 17px; }
#app.split #controls > button { height: 64px; }

@media (max-width: 380px) { #controls button span { font-size: 10px; } #controls { gap: 6px; } }
@media (min-width: 800px) {
  #code { font-size: 22px; }
  .logo { font-size: 32px; }
}
</style>
</head>
<body>
<div id="app" class="crt">
  <!-- ================= EDIT MODE ================= -->
  <section id="edit">
    <header>
      <div class="logo" data-text="KEYMASH_">KEYMASH_</div>
      <div id="status"><b class="ok">0 ERRORS</b> · <span id="st-threads">0</span> THREADS · <span id="st-glyphs">0</span> GLYPHS<b id="st-live"> · LIVE</b></div>
      <button id="btn-mute-edit" class="hbtn" title="sound on/off">🔊</button>
    </header>
    <div id="editorWrap">
      <canvas id="rain"></canvas>
      <canvas id="sparks"></canvas>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="type anything.&#10;mash the keys.&#10;let the dog walk over it.&#10;&#10;there are no errors."></textarea>
    </div>
    <div id="keybar" role="toolbar" aria-label="extra keys"></div>
    <nav id="controls">
      <button id="btn-run" class="primary"><i>▶</i><span>RUN</span></button>
      <button id="btn-mash" title="let a virtual paw type"><i>🐾</i><span>MASH</span></button>
      <button id="btn-clear"><i>✖</i><span>CLEAR</span></button>
      <button id="btn-save"><i>💾</i><span>SAVE</span></button>
      <button id="btn-load"><i>📂</i><span>LOAD</span></button>
    </nav>
  </section>

  <!-- ================= PLAY MODE ================= -->
  <section id="play" hidden>
    <div id="stageWrap">
      <canvas id="stage"></canvas>
      <div id="hud"></div>
      <div id="log"></div>
      <div id="boot"></div>
      <div id="idle"><button id="btn-idle-run">▶ RUN</button><p>edit on the left — changes go live while it runs</p></div>
      <div class="playbtns">
        <button id="btn-mute" title="sound on/off">🔊</button>
        <button id="btn-restart" title="restart">⟲</button>
        <button id="btn-stop" class="primary">■ EDIT</button>
      </div>
    </div>
    <div id="codeview"></div>
  </section>

  <!-- ================= DRAWER ================= -->
  <div id="drawer" hidden>
    <div class="panel">
      <div class="phead"><span>// PROGRAMS</span><button id="drawer-close">✖</button></div>
      <div id="drawer-body"></div>
    </div>
  </div>
  <div id="toast" hidden></div>
</div>
