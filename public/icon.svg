<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- KEYMASH_ app icon: a paw print whose toes are home-row keycaps. Source for public/*.png (scripts/icons.ts). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0" stop-color="#0d4421"/>
      <stop offset="0.55" stop-color="#03200d"/>
      <stop offset="1" stop-color="#000800"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f5a2b"/>
      <stop offset="1" stop-color="#05301a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="2.4" y="3.6" fill="#000" opacity="0.28"/>
    </pattern>
    <g id="paw">
      <rect x="-37" y="-44" width="74" height="88" rx="22" transform="translate(126 196) rotate(-24)"/>
      <rect x="-37" y="-44" width="74" height="88" rx="22" transform="translate(207 132) rotate(-8)"/>
      <rect x="-37" y="-44" width="74" height="88" rx="22" transform="translate(305 132) rotate(8)"/>
      <rect x="-37" y="-44" width="74" height="88" rx="22" transform="translate(386 196) rotate(24)"/>
      <path d="M256 238 C 322 238 382 300 388 358 C 394 410 350 430 310 418 C 286 411 272 404 256 404 C 240 404 226 411 202 418 C 162 430 118 410 124 358 C 130 300 190 238 256 238 Z"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g id="art">
    <!-- chromatic glitch offsets -->
    <use href="#paw" fill="none" stroke="#ff2e88" stroke-width="7" opacity="0.75" transform="translate(-7 2)"/>
    <use href="#paw" fill="none" stroke="#29f3ff" stroke-width="7" opacity="0.75" transform="translate(7 -2)"/>
    <!-- keycaps -->
    <use href="#paw" fill="url(#cap)" stroke="#39ff7a" stroke-width="8" filter="url(#glow)"/>
    <g font-family="'Share Tech Mono','DejaVu Sans Mono',Menlo,monospace" font-weight="bold" fill="#b6ffcc" text-anchor="middle" filter="url(#glow)">
      <text x="126" y="214" font-size="52" transform="rotate(-24 126 196)">A</text>
      <text x="207" y="150" font-size="52" transform="rotate(-8 207 132)">S</text>
      <text x="305" y="150" font-size="52" transform="rotate(8 305 132)">D</text>
      <text x="386" y="214" font-size="52" transform="rotate(24 386 196)">F</text>
      <text x="252" y="366" font-size="92" letter-spacing="2">&gt;_</text>
    </g>
  </g>
  <rect width="512" height="512" fill="url(#scan)"/>
</svg>
